[project]
name = "rvs-worker-compiler"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
  "easyocr==1.7.2",
  "geffnet==1.0.2",
  "numpy==2.2.6",
  "opencv-python-headless==4.11.0.86",
  "scipy==1.15.3",
  "timm==1.0.22",
  "torch==2.9.1+cpu",
  "torchvision==0.24.1+cpu",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
