# Brings the two self-hosted generators up for real.
#
# The base docker-compose.yml already declares `wan-alpha` and `hi3dgen`,
# but points them at image tags that do not exist anywhere -- so `--profile
# video up` fails with "image not found" and nothing says what to build.
# This overlay supplies the missing half: the build contexts under
# generators/, so the services can actually start.
#
# Usage (from apps/worker), one generator at a time:
#
#   docker compose -f docker-compose.yml -f docker-compose.generators.yml \
#     --profile video up -d --build wan-alpha
#
#   docker compose -f docker-compose.yml -f docker-compose.generators.yml \
#     --profile model3d up -d --build hi3dgen
#
# Then set the matching address in the admin console under
# Material generators -- http://wan-alpha:8000 and http://hi3dgen:8000 --
# and the API sends it to the worker with each assets claim.
#
# One at a time is not a suggestion. Wan2.1-14B at GGUF Q4_K_M is about
# 10GB of VRAM before its text encoder, and Hi3DGen needs 6-8GB even with
# staged CPU offload; a 12GB card fits one. Switching should be a container
# restart, not an in-process unload, because PyTorch does not reliably
# return reserved memory to the operating system.
#
# Both stay on worker-internal, which is `internal: true` -- they have no
# route off the host, which is the point: generated material never leaves
# the machine and the worker still has no internet. That also means model
# weights cannot be downloaded at runtime. Mount them: put the caches on
# the host and point RVS_MODEL_CACHE at them (see generators/README.md).

x-generator-common: &generator-common
  restart: always
  init: true
  stop_grace_period: 60s
  networks:
    - worker-internal
  volumes:
    # Weights live on the host, not in the image: they are tens of
    # gigabytes and the container has no network to fetch them with.
    - ${RVS_MODEL_CACHE:-./generators/models}:/models:ro
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
    interval: 30s
    timeout: 10s
    retries: 3
    # Loading a 14B model off disk is minutes, not seconds. A short start
    # period would mark a healthy service unhealthy while it was still
    # doing exactly what it was told to.
    start_period: 600s

services:
  wan-alpha:
    <<: *generator-common
    build:
      context: ./generators/wan-alpha
      dockerfile: Dockerfile
    image: ${RVS_WAN_ALPHA_IMAGE:-rvs-wan-alpha:local}
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HOME: /models/huggingface
      # Quantised base, for a 12GB card. Unverified in this combination:
      # Wan-Alpha's RGBA output needs a DoRA and two custom VAE decoders on
      # top of Wan2.1-14B, and no report exists of that working over a
      # GGUF-quantised base. The fp8 base is the lower-risk route and does
      # not fit 12GB. Quality at Q4 has only ever been assessed on RGB,
      # never on alpha edges -- hair, glow, semi-transparency -- which is
      # what this model exists for. Test the matte before relying on it.
      RVS_WAN_BASE: ${RVS_WAN_BASE:-/models/wan2.1-14b-Q4_K_M.gguf}
      RVS_WAN_DORA: ${RVS_WAN_DORA:-/models/wan-alpha-dora}
      RVS_WAN_VAE_RGB: ${RVS_WAN_VAE_RGB:-/models/wan-alpha-vae-rgb}
      RVS_WAN_VAE_ALPHA: ${RVS_WAN_VAE_ALPHA:-/models/wan-alpha-vae-alpha}

  hi3dgen:
    <<: *generator-common
    build:
      context: ./generators/hi3dgen
      dockerfile: Dockerfile
    image: ${RVS_HI3DGEN_IMAGE:-rvs-hi3dgen:local}
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HOME: /models/huggingface
      RVS_HI3DGEN_WEIGHTS: ${RVS_HI3DGEN_WEIGHTS:-/models/hi3dgen}
      # Hi3DGen is image-to-3D. The worker asks for material with a prompt
      # and nothing else (see self-hosted-3d-material-provider.ts's
      # Hi3DGenClient), so this service has to draw the reference image
      # itself before it can lift it into a mesh. Unset this and an
      # object-form asset fails by name rather than silently returning
      # something that is not what the scene asked for.
      RVS_HI3DGEN_T2I: ${RVS_HI3DGEN_T2I:-/models/sdxl-turbo}
      # Hi3DGen leaks VRAM between generations (Stable3DGen issue #42
      # reports 14.2GB growing to 23.9GB over three runs), so the server
      # frees outputs and empties the CUDA cache after every request. Set
      # this to 0 only while investigating that.
      RVS_HI3DGEN_EMPTY_CACHE: ${RVS_HI3DGEN_EMPTY_CACHE:-1}
