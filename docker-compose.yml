services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RVS_API_BASE_URL: ${RVS_API_BASE_URL:-http://host.docker.internal:3100}
      RVS_WORKER_TOKEN: ${RVS_WORKER_TOKEN:-}
      RVS_WORKER_CAPABILITIES: ${RVS_WORKER_CAPABILITIES:-compiler,renderer}
    command: ["pnpm", "start"]
  worker-smoke:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: none
    environment:
      CI: "true"
      RVS_NO_NETWORK: "1"
    command: ["pnpm", "compiler:smoke"]
