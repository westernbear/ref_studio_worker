x-worker-env-files: &worker-env-files
  - path: .env
    required: false

# Shared by the two GPU generators below. Weights live on the host, not in
# the image: they are tens of gigabytes and worker-internal is
# `internal: true`, so these containers have no network to fetch them with.
# Build-time mirrors. torch and its CUDA libraries are the bulk of these
# images and come from the base image rather than a wheel download, but the
# rest still comes from Ubuntu and PyPI, which are slow from some networks
# and occasionally serve a stale index. Point these at something closer:
#
#   RVS_APT_MIRROR=mirror.kakao.com
#   RVS_PIP_INDEX_URL=https://mirror.kakao.com/pypi/simple
#
# Empty APT_MIRROR leaves the distribution's own sources alone.
x-generator-build-args: &generator-build-args
  TORCH_IMAGE: ${RVS_TORCH_IMAGE:-pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime}
  APT_MIRROR: ${RVS_APT_MIRROR:-}
  PIP_INDEX_URL: ${RVS_PIP_INDEX_URL:-https://pypi.org/simple}

x-generator-gpu-env: &generator-gpu-env
  NVIDIA_VISIBLE_DEVICES: all
  NVIDIA_DRIVER_CAPABILITIES: compute,utility
  HF_HOME: /models/huggingface
x-generator-common: &generator-common
  restart: always
  init: true
  stop_grace_period: 60s
  networks:
    - worker-internal
  volumes:
    - ${RVS_MODEL_CACHE:-./generators/models}:/models:ro
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
  healthcheck:
    test:
      - CMD
      - python3
      - -c
      - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"
    interval: 30s
    timeout: 10s
    retries: 3
    # Loading a 14B model off disk is minutes, not seconds. A short start
    # period would mark a healthy service unhealthy while it was still
    # doing exactly what it was told to.
    start_period: 600s

services:
  api-relay:
    image: reference-video-studio-worker:1.0.0
    restart: always
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: *worker-env-files
    environment:
      # Operator-facing remote API setting; the worker itself only sees this relay.
      RVS_API_BASE_URL: ${RVS_API_BASE_URL:-http://host.docker.internal:3200}
      RVS_RELAY_REQUEST_TIMEOUT_MS: ${RVS_RELAY_REQUEST_TIMEOUT_MS:-1800000}
    command: ["node", "dist/api-relay.js"]
    networks:
      - worker-internal
      - default
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require("node:http").get("http://127.0.0.1:8787/_relay/healthz",response=>process.exit(response.statusCode===204?0:1)).on("error",()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
  worker:
    image: reference-video-studio-worker:1.0.0
    restart: always
    init: true
    stop_grace_period: 30s
    cpus: 4.0
    mem_limit: 12g
    pids_limit: 512
    build:
      context: .
      dockerfile: Dockerfile
    env_file: *worker-env-files
    depends_on:
      api-relay:
        condition: service_healthy
    environment:
      RVS_API_BASE_URL: http://api-relay:8787
      RVS_WORKER_CAPABILITIES: ${RVS_WORKER_CAPABILITIES:-compiler,renderer}
      RVS_API_REQUEST_TIMEOUT_MS: ${RVS_API_REQUEST_TIMEOUT_MS:-30000}
      RVS_MEDIA_REQUEST_TIMEOUT_MS: ${RVS_MEDIA_REQUEST_TIMEOUT_MS:-1800000}
      RVS_HEARTBEAT_INTERVAL_MS: ${RVS_HEARTBEAT_INTERVAL_MS:-30000}
      RVS_POLL_INTERVAL_MS: ${RVS_POLL_INTERVAL_MS:-5000}
    networks:
      - worker-internal
  # Self-hosted inference, reachable only from the worker. Both sit on
  # worker-internal and nothing else: that network is `internal: true`, so
  # these services have no route off the host either, which is the point --
  # generated material never leaves the machine and the worker still has no
  # internet. Neither is started by default; bring one up and set the
  # matching RVS_*_BASE_URL, or leave it out and that material kind keeps
  # failing closed by name. Separate profiles on purpose: a 14B video model
  # at Q4 is ~10GB of a 12GB card before its text encoder, so these two
  # cannot co-reside on one GPU. Pick one, or give them a GPU each.
  # Set RVS_WAN_ALPHA_IMAGE / RVS_HI3DGEN_IMAGE to
  # the serving images you built; the defaults below are local tags that
  # will simply not resolve until you do.
  wan-alpha:
    profiles: ["video"]
    <<: *generator-common
    build:
      context: ./generators/wan-alpha
      dockerfile: Dockerfile
      args:
        <<: *generator-build-args
    image: ${RVS_WAN_ALPHA_IMAGE:-rvs-wan-alpha:local}
    environment:
      <<: *generator-gpu-env
      # Quantised base, for a 12GB card. Unverified in this combination:
      # Wan-Alpha's RGBA output needs a DoRA and two custom VAE decoders on
      # top of Wan2.1-14B, and no report exists of that working over a
      # GGUF-quantised base. The fp8 base is the lower-risk route and does
      # not fit 12GB. Quality at Q4 has only ever been assessed on RGB,
      # never on alpha edges -- hair, glow, semi-transparency -- which is
      # what this model exists for. Test the matte before relying on it.
      RVS_WAN_BASE: ${RVS_WAN_BASE:-/models/wan2.1-14b-Q4_K_M.gguf}
      RVS_WAN_DORA: ${RVS_WAN_DORA:-/models/wan-alpha-dora}
      RVS_WAN_VAE_RGB: ${RVS_WAN_VAE_RGB:-/models/wan-alpha-vae-rgb}
      RVS_WAN_VAE_ALPHA: ${RVS_WAN_VAE_ALPHA:-/models/wan-alpha-vae-alpha}
  hi3dgen:
    profiles: ["model3d"]
    <<: *generator-common
    build:
      context: ./generators/hi3dgen
      dockerfile: Dockerfile
      args:
        <<: *generator-build-args
    image: ${RVS_HI3DGEN_IMAGE:-rvs-hi3dgen:local}
    environment:
      <<: *generator-gpu-env
      RVS_HI3DGEN_WEIGHTS: ${RVS_HI3DGEN_WEIGHTS:-/models/hi3dgen}
      # Hi3DGen is image-to-3D. The worker asks for material with a prompt
      # and nothing else (see self-hosted-3d-material-provider.ts's
      # postGenerate helper), so this service has to draw the reference image
      # itself before it can lift it into a mesh. Unset this and an
      # object-form asset fails by name rather than silently returning
      # something that is not what the scene asked for.
      RVS_HI3DGEN_T2I: ${RVS_HI3DGEN_T2I:-/models/sdxl-turbo}
      # Hi3DGen leaks VRAM between generations (Stable3DGen issue #42
      # reports 14.2GB growing to 23.9GB over three runs), so the server
      # frees outputs and empties the CUDA cache after every request. Set
      # this to 0 only while investigating that.
      RVS_HI3DGEN_EMPTY_CACHE: ${RVS_HI3DGEN_EMPTY_CACHE:-1}
  worker-smoke:
    profiles: ["smoke"]
    image: reference-video-studio-worker:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: none
    environment:
      CI: "true"
      RVS_NO_NETWORK: "1"
    command:
      - /bin/sh
      - -ec
      - |
        /usr/bin/ffmpeg -version >/dev/null
        /usr/bin/ffprobe -version >/dev/null
        /opt/chrome/chrome --version
        /opt/compiler-venv/bin/python -m unittest compiler.test_pipeline
        /opt/compiler-venv/bin/python -c 'from compiler.pipeline import verify_models, load_models; verify_models(); models = load_models(); assert set(models) == {"torch", "rvm", "midas", "ocr"}'

networks:
  default: {}
  worker-internal:
    internal: true
